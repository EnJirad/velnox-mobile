name: Build Velnox APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Android SDK
        run: |
          mkdir -p /home/runner/android-sdk
          cd /home/runner/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/latest/bin
          mv cmdline-tools/lib cmdline-tools/latest/lib
          yes | cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"
          yes | cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -O gradle-bin.zip
          unzip -q gradle-bin.zip -d /home/runner
          echo "GRADLE_HOME=/home/runner/gradle-8.11.1" >> $GITHUB_ENV
          echo "/home/runner/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        id: unit_tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee unit-tests.log
        env:
          ANDROID_SDK_ROOT: /home/runner/android-sdk
          ANDROID_HOME: /home/runner/android-sdk
          GRADLE_HOME: /home/runner/gradle-8.11.1

      # Compiler and test output is otherwise buried in the job log. Re-emitting
      # the first failures as annotations puts them on the run summary page.
      - name: Surface Kotlin and test failures
        if: failure()
        run: |
          # Compiler errors first: they mean nothing ran at all.
          grep -E "^e: |error:" unit-tests.log \
            | head -15 \
            | while IFS= read -r line; do echo "::error::$line"; done || true
          # Then the individual failing tests, by name, from the JUnit XML.
          # Gradle's console lines are prefixed by the runner, so the XML is the
          # only reliable source for which assertion failed and why.
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for failure in case.findall("failure") + case.findall("error"):
                      name = f"{case.get('classname')}.{case.get('name')}"
                      msg = (failure.get("message") or "").strip().splitlines()
                      print(f"::error::{name}: {msg[0] if msg else 'failed'}")
          PY

      - name: Publish unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velnox-unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            unit-tests.log
          if-no-files-found: ignore
          retention-days: 30

      # One certificate for every APK that reaches a phone.
      #
      # Two things depend on it: Android refuses to install an update signed with a
      # different key (the user has to uninstall first), and Google Sign-In binds an
      # OAuth client to (package name, signing SHA-1), so an Android client cannot
      # exist for a moving fingerprint.
      #
      # This step is fail-closed. It does NOT fall back to a generated keystore: a
      # missing, unreadable or wrongly-aliased secret stops the build here, with a
      # message saying which of the three it is. Silently generating a replacement
      # is what produced a new fingerprint on every run before.
      #
      # Secrets (Settings -> Secrets and variables -> Actions):
      #   ANDROID_DEBUG_KEYSTORE_BASE64   required: base64 of a PKCS12/JKS store
      #   ANDROID_DEBUG_KEYSTORE_PASSWORD optional, defaults to android
      # The alias must be androiddebugkey, the standard Android debug alias, and the
      # key password must equal the store password.
      - name: Provide the pinned debug signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          EXPECTED_ALIAS: androiddebugkey
        run: |
          set -uo pipefail

          STORE="$RUNNER_TEMP/velnox-debug.keystore"
          PASS="${STORE_PASSWORD_SECRET:-android}"

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error title=Signing secret missing::ANDROID_DEBUG_KEYSTORE_BASE64 is not set, so no APK can be signed with the pinned key. Add the base64 of the debug keystore as a repository secret. This workflow will not generate a replacement."
            exit 1
          fi

          # Decoded into the runner temp directory, never echoed, never committed,
          # and deliberately NOT at ~/.android/debug.keystore: that is the path the
          # Android plugin regenerates when it finds something it does not accept.
          umask 077
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$STORE" 2>/dev/null; then
            echo "::error title=Signing secret is not base64::ANDROID_DEBUG_KEYSTORE_BASE64 does not decode. Store the raw base64 of the keystore file, with no PEM header and no newlines."
            exit 1
          fi
          if [ ! -s "$STORE" ]; then
            echo "::error title=Signing secret is empty::ANDROID_DEBUG_KEYSTORE_BASE64 decoded to zero bytes."
            exit 1
          fi
          chmod 600 "$STORE"

          if ! command -v keytool >/dev/null 2>&1; then
            echo "::error title=keytool not found::The JDK step did not put keytool on PATH, so the pinned keystore cannot be validated."
            exit 1
          fi

          # Validated before Gradle runs. keytool's own message is printed because it
          # names the failure without revealing anything: the password is never
          # echoed, and the store contents are never printed.
          if ! OUT=$(keytool -list -v -keystore "$STORE" -storepass "$PASS" 2>&1); then
            # keytool puts the reason on the first line of its trace, then stack
            # frames. Print the reason; it never contains the password.
            printf '%s\n' "$OUT" | head -3
            echo "::error title=Keystore cannot be opened::The decoded file is not a keystore this build can use, or ANDROID_DEBUG_KEYSTORE_PASSWORD is wrong (it defaults to android). Re-create the keystore with the documented command, base64 the .keystore file alone, and store it with no header and no line breaks."
            exit 1
          fi
          if ! printf '%s\n' "$OUT" | grep -q "Alias name: ${EXPECTED_ALIAS}"; then
            echo "::error title=Expected alias not found::The keystore has no ${EXPECTED_ALIAS} entry. Aliases present:"
            printf '%s\n' "$OUT" | grep "Alias name:" || true
            exit 1
          fi

          # Public fingerprint only: this is the value registered with Google, and
          # the APK must carry the same one.
          # keytool spells these SHA256/SHA1 on JDK 17 and SHA-256/SHA-1 on older
          # builds, so both spellings are accepted rather than silently matching
          # neither.
          EXPECTED_SHA256=$(printf '%s\n' "$OUT" | grep -m1 -E "(SHA256|SHA-256):" | sed -E "s/.*SHA-?256: //" | tr -d ":" | tr "A-F" "a-f")
          EXPECTED_SHA1=$(printf '%s\n' "$OUT" | grep -m1 -E "(SHA1|SHA-1):" | sed -E "s/.*SHA-?1: //" | tr -d ":" | tr "A-F" "a-f")
          if [ -z "$EXPECTED_SHA256" ] || [ -z "$EXPECTED_SHA1" ]; then
            echo "::error title=Keystore fingerprint unreadable::keytool listed the store but printed no SHA-1/SHA-256 digest."
            exit 1
          fi
          echo "Pinned signing certificate SHA-1:   $EXPECTED_SHA1"
          echo "Pinned signing certificate SHA-256: $EXPECTED_SHA256"
          echo "::add-mask::$PASS"

          {
            echo "VELNOX_DEBUG_STORE_FILE=$STORE"
            echo "VELNOX_DEBUG_STORE_PASSWORD=$PASS"
            echo "VELNOX_DEBUG_KEY_ALIAS=$EXPECTED_ALIAS"
            echo "VELNOX_DEBUG_KEY_PASSWORD=$PASS"
            echo "EXPECTED_CERT_SHA1=$EXPECTED_SHA1"
            echo "EXPECTED_CERT_SHA256=$EXPECTED_SHA256"
          } >> "$GITHUB_ENV"

      # The Google client id is a public identifier, so it can also be baked in at
      # build time from a repository *variable* (not a secret). Either source works:
      # this one, or GET /api/auth/mobile/config at runtime. An unset variable is an
      # empty string, which means "ask the backend", never "fake a value".
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --refresh-dependencies -PvelnoxGoogleClientId="$GOOGLE_WEB_CLIENT_ID"
        env:
          ANDROID_SDK_ROOT: /home/runner/android-sdk
          ANDROID_HOME: /home/runner/android-sdk
          GRADLE_HOME: /home/runner/gradle-8.11.1
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then echo "ERROR: APK not found"; exit 1; fi
          APK_SIZE=$(stat -c%s "$APK_PATH")
          if [ "$APK_SIZE" -eq 0 ]; then echo "ERROR: APK empty"; exit 1; fi
          echo "APK size: $APK_SIZE bytes"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Verify APK integrity
        run: |
          unzip -t "$APK_PATH" > /dev/null
          echo "APK integrity: OK"

      # The APK must carry the certificate of the keystore this run was given. This
      # is the check that turns "the build produced something" into "the build
      # produced an APK that can update the installed app and be registered with
      # Google". It fails the job rather than printing a new fingerprint with a
      # shrug, which is how the instability went unnoticed.
      - name: Verify APK signature and package id
        run: |
          set -uo pipefail

          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          AAPT2=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 | sort | tail -1)

          "$APKSIGNER" verify --print-certs "$APK_PATH" | tee certs.txt

          ACTUAL_SHA256=$(grep -i "SHA-256 digest" certs.txt | head -1 | sed 's/.*: //' | tr -d ':' | tr 'A-F' 'a-f')
          ACTUAL_SHA1=$(grep -i "SHA-1 digest" certs.txt | head -1 | sed 's/.*: //')
          EXPECTED=$(printf '%s' "${EXPECTED_CERT_SHA256:-}" | tr -d ':' | tr 'A-F' 'a-f')

          if [ -z "$EXPECTED" ]; then
            echo "::error title=No expected certificate::EXPECTED_CERT_SHA256 was not exported by the signing step, so this APK cannot be proven to carry the pinned key."
            exit 1
          fi
          EXPECTED_SHA1=$(printf '%s' "${EXPECTED_CERT_SHA1:-}" | tr -d ':' | tr 'A-F' 'a-f')
          ACTUAL_SHA1_NORM=$(printf '%s' "$ACTUAL_SHA1" | tr -d ':' | tr 'A-F' 'a-f')

          if [ "$ACTUAL_SHA256" != "$EXPECTED" ] || [ "$ACTUAL_SHA1_NORM" != "$EXPECTED_SHA1" ]; then
            echo "::error title=APK signed with the wrong key::expected SHA-256 $EXPECTED / SHA-1 $EXPECTED_SHA1, got SHA-256 $ACTUAL_SHA256 / SHA-1 $ACTUAL_SHA1_NORM. This APK would not install over an existing one, and no Android OAuth client can match it."
            exit 1
          fi

          PKG=$("$AAPT2" dump packagename "$APK_PATH" | tr -d '\r')
          if [ "$PKG" != "com.velnox.app" ]; then
            echo "::error title=Unexpected package id::the APK declares $PKG instead of com.velnox.app, so it would install as a second app."
            exit 1
          fi

          echo "APK signature matches the pinned keystore; package id unchanged."
          {
            echo "### APK signing certificate"
            echo ""
            echo "- Package: \`$PKG\`"
            echo "- SHA-1: \`$ACTUAL_SHA1\`"
            echo "- SHA-256: \`$ACTUAL_SHA256\`"
            echo "- Matches the pinned keystore: yes"
            echo ""
            echo "Register the SHA-1 on the **Android** OAuth client for this package."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=APK signing SHA-1 ($ACTUAL_SHA1)::SHA-1 $ACTUAL_SHA1 / SHA-256 $ACTUAL_SHA256 for package $PKG"
        env:
          ANDROID_SDK_ROOT: /home/runner/android-sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: velnox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
