name: Build Velnox APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Android SDK
        run: |
          mkdir -p /home/runner/android-sdk
          cd /home/runner/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/latest/bin
          mv cmdline-tools/lib cmdline-tools/latest/lib
          yes | cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"
          yes | cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -O gradle-bin.zip
          unzip -q gradle-bin.zip -d /home/runner
          echo "GRADLE_HOME=/home/runner/gradle-8.11.1" >> $GITHUB_ENV
          echo "/home/runner/gradle-8.11.1/bin" >> $GITHUB_PATH

      # Google Sign-In binds an OAuth client to (package name, signing SHA-1), so
      # that fingerprint has to be the same on every build.
      #
      # Caching ~/.android/debug.keystore was tried first and does NOT work here:
      # consecutive runs produced different fingerprints, so the restore is not
      # taking effect for this path. Pinning the key explicitly is the reliable
      # way, and it is opt-in so a fork without the secret still builds.
      #
      # To pin it, create a debug keystore once and store its base64 as the
      # ANDROID_DEBUG_KEYSTORE_BASE64 repository secret:
      #   keytool -genkeypair -v -keystore debug.keystore -storepass android \
      #     -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
      #     -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      #   base64 -w0 debug.keystore
      - name: Provide the debug signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Decoded only into the runner's home directory, never echoed, never
            # committed. 0600 because a keystore is a credential.
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            chmod 600 "$KEYSTORE"
            echo "Using the pinned keystore from ANDROID_DEBUG_KEYSTORE_BASE64."
            # Public fingerprints only: this is what must be registered with Google,
            # and printing it here proves the same key is used on every run.
            keytool -list -v -keystore "$KEYSTORE" -storepass android 2>/dev/null \
              | grep -E "SHA-1:|SHA-256:" \
              | sed 's/^/  pinned debug keystore /'
          else
            echo "::warning title=Debug signing key is not pinned::No ANDROID_DEBUG_KEYSTORE_BASE64 secret is set, so this runner generates its own debug keystore. The APK signing SHA-1 will change on the next build, and an Android OAuth client registered against it will stop working."
            {
              echo "### ⚠️ ACTION REQUIRED — Google Sign-In cannot work until the debug key is pinned"
              echo ""
              echo "No \`ANDROID_DEBUG_KEYSTORE_BASE64\` repository secret is set, so every"
              echo "run signs the APK with a different key. Google binds an Android OAuth"
              echo "client to \`com.velnox.app\` + one SHA-1, so no client can match this build."
              echo ""
              echo "Owner steps (once):"
              echo ""
              echo '```bash'
              echo 'keytool -genkeypair -v -keystore velnox-debug.keystore -storepass android \'
              echo '  -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \'
              echo '  -validity 10000 -dname "CN=Android Debug,O=Android,C=US"'
              echo 'base64 -w0 velnox-debug.keystore | pbcopy   # or: > keystore.b64'
              echo '```'
              echo ""
              echo "1. Save the base64 output as the repository secret \`ANDROID_DEBUG_KEYSTORE_BASE64\`"
              echo "   (Settings → Secrets and variables → Actions → New repository secret)."
              echo "2. Re-run this workflow and copy the SHA-1 from the step summary."
              echo "3. Register that SHA-1 on an **Android** OAuth client for \`com.velnox.app\`"
              echo "   in the same Google Cloud project as the Web client."
              echo "4. Delete the local \`velnox-debug.keystore\` after uploading it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        id: unit_tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee unit-tests.log
        env:
          ANDROID_SDK_ROOT: /home/runner/android-sdk
          ANDROID_HOME: /home/runner/android-sdk
          GRADLE_HOME: /home/runner/gradle-8.11.1

      # Compiler and test output is otherwise buried in the job log. Re-emitting
      # the first failures as annotations puts them on the run summary page.
      - name: Surface Kotlin and test failures
        if: failure()
        run: |
          # Compiler errors first: they mean nothing ran at all.
          grep -E "^e: |error:" unit-tests.log \
            | head -15 \
            | while IFS= read -r line; do echo "::error::$line"; done || true
          # Then the individual failing tests, by name, from the JUnit XML.
          # Gradle's console lines are prefixed by the runner, so the XML is the
          # only reliable source for which assertion failed and why.
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for failure in case.findall("failure") + case.findall("error"):
                      name = f"{case.get('classname')}.{case.get('name')}"
                      msg = (failure.get("message") or "").strip().splitlines()
                      print(f"::error::{name}: {msg[0] if msg else 'failed'}")
          PY

      - name: Publish unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velnox-unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            unit-tests.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --refresh-dependencies
        env:
          ANDROID_SDK_ROOT: /home/runner/android-sdk
          ANDROID_HOME: /home/runner/android-sdk
          GRADLE_HOME: /home/runner/gradle-8.11.1

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then echo "ERROR: APK not found"; exit 1; fi
          APK_SIZE=$(stat -c%s "$APK_PATH")
          if [ "$APK_SIZE" -eq 0 ]; then echo "ERROR: APK empty"; exit 1; fi
          echo "APK size: $APK_SIZE bytes"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Verify APK integrity
        run: |
          unzip -t "$APK_PATH" > /dev/null
          echo "APK integrity: OK"

      # Prints the fingerprints to register in Google Cloud Console. Put the
      # SHA-1 into the Android OAuth client for package com.velnox.app.
      - name: Print APK signing fingerprints
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK_PATH" | tee certs.txt
          SHA1=$(grep -i "SHA-1 digest" certs.txt | head -1 | sed 's/.*: //')
          SHA256=$(grep -i "SHA-256 digest" certs.txt | head -1 | sed 's/.*: //')
          echo "### APK signing certificate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: `com.velnox.app`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-1: `$SHA1`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: `$SHA256`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Register the SHA-1 on an Android OAuth client for this package." >> "$GITHUB_STEP_SUMMARY"
          # Also emit it as an annotation: the job summary is not readable from
          # the API, and this value has to be copied into Google Cloud Console.
          echo "::notice title=APK signing SHA-1 ($SHA1)::SHA-1 $SHA1 / SHA-256 $SHA256 for package com.velnox.app"
        env:
          ANDROID_SDK_ROOT: /home/runner/android-sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: velnox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
